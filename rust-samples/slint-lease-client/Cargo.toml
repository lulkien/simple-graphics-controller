[package]
name = "slint-lease-client"
description = "Demo: run a Slint UI on a DRM lease granted by simple-graphics-controller"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone (NOT a workspace member): depends on the slint fork (release/1.17
# based, branch sgc-lease-1.17) by sibling path, which must not be pulled into
# the sgc workspace builds. The empty [workspace] table opts this crate out of
# the enclosing sgc workspace.
[workspace]
#
# Build flavors (mirror the sgc linkage convention):
#   software renderer -> musl, fully static (fontconfig dlopened at runtime)
#       cargo build --release --target aarch64-unknown-linux-musl
#   femtovg (GL)      -> gnu, dynamic (links board libgbm; fontconfig dlopen)
#       PKG_CONFIG_ALLOW_CROSS=1 PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
#       cargo build --release --no-default-features --features femtovg \
#           --target aarch64-unknown-linux-gnu
# Both need CARGO_TARGET_..._RUSTFLAGS="-C linker=<cross-gcc>" unless the
# linker is configured for the target.
#
# The app depends on the linuxsgc backend only: the backend owns the @sgc
# session (connect, acquire, revoke/re-grant survival) via its libsgc-rs path
# dependency, so no SgcClient code lives in the app.

[features]
default = ["software"]
# i-slint-backend-linuxsgc/renderer-software (fontique dlopen is baked into the
# backend crate so musl static builds never link libfontconfig)
software = ["i-slint-backend-linuxsgc/renderer-software"]
# GL over gbm/EGL on the lease fd (gnu dynamic build)
femtovg = ["i-slint-backend-linuxsgc/renderer-femtovg"]

[dependencies]
slint = { path = "../../../slint/api/rs/slint", default-features = false, features = [
    "std",
    "compat-1-2",
    "unstable-fontique-010",
] }
i-slint-backend-linuxsgc = { path = "../../../slint/internal/backends/linuxsgc", default-features = false }
anyhow = "1"
