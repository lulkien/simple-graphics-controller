[package]
name = "simple-graphics-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
thiserror = "1.0"
nix = { version = "0.29", features = ["fs", "socket", "uio"] }
sendfd = { version = "0.4.4", features = ["tokio"] }

[lib]
crate-type = ["lib"]

