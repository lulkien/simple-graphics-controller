# Board build: the daemon binary lives in /root (no .deb installed yet), so keep
# the packaged unit and override the two settings that assume a packaged layout.
#
#   ExecStart   - the packaged unit expects /usr/bin/simple-graphics-controller.
#   ProtectHome - the packaged unit sets ProtectHome=yes, which hides /root (it
#                 is the root user's home) and makes the daemon fail to exec with
#                 "No such file or directory". Turn it off while the binary lives
#                 there; drop this line once the .deb is installed.
#
# The empty ExecStart= clears the packaged value - systemd drop-ins append
# otherwise.
[Service]
ExecStart=
ExecStart=/root/simple-graphics-controller-gnu
ProtectHome=no
