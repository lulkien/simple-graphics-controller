[package]
name = "simple-graphics-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resource daemon that leases DRM/fbdev display and input devices to clients over the @sgc socket"

[features]
# Backends are compile-time features: a build includes exactly the backends
# it was compiled with. The protocol crate is deliberately ungated — an
# unbuilt backend is simply never advertised, and Acquires against it are
# denied "not registered". See docs/resource-manager.md.
default = ["drm", "input"]
fbdev = []
drm = ["dep:drm"]
input = ["dep:evdev"]

[dependencies]
simple-graphics-protocol = { path = "../simple-graphics-protocol" }
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["fs", "socket", "uio"] }
sendfd = { version = "0.4.4", features = ["tokio"] }
dashmap = "6.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
thiserror = "1"
evdev = { version = "0.12", optional = true }
drm = { version = "0.15", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# --- .deb packaging (cargo-deb) -----------------------------------------
# The server package: the daemon + the runtime shared libsgc.so (apps that
# link libsgc dynamically need only this package). The daemon is the
# default-features build (drm + input); a fbdev-only server is a separate
# concern.
[package.metadata.deb]
maintainer = "lulkien <kien.luuhoang.arch@proton.me>"
name = "simple-graphics-controller"
section = "admin"
# NOT Multi-Arch: same — this package ships the daemon (/usr/bin) next to
# the runtime lib, which Debian policy forbids in a multiarch package.
# Ship the .so at the plain /usr/lib (vendor-style) and call cargo-deb
# without --multiarch (see the deb recipes).
depends = "$auto"
assets = [
    "$auto",
    # "target/release" is the magic prefix: cargo-deb resolves it inside the
    # workspace target dir, honoring --target (cross) and the profile. The
    # daemon crate lives one level under the workspace, so the magic form is
    # required — a "../target/release/..." path is treated as a plain file
    # relative to the crate and silently resolves to the *host* artifact.
    ["target/release/libsgc.so", "usr/lib/libsgc.so", "644"],
]
